[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rental-demand-signal-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "python-dotenv>=1.0", "streamlit>=1.35"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rdsa = "rdsa.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rdsa*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
